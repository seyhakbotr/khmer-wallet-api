spring:
  application:
    name: wallet-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

app:
  jwt:
    # HS256 requires at least 32 bytes. Always override this outside local development.
    secret: ${JWT_SECRET:dev-only-secret-please-change-in-production-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

server:
  port: ${SERVER_PORT:8080}
