spring:
  application:
    name: wallet-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

app:
  jwt:
    # HS256 requires at least 32 bytes. Always override this outside local development.
    secret: ${JWT_SECRET:dev-only-secret-please-change-in-production-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  zone: ${APP_ZONE:Asia/Phnom_Penh}
  transfers:
    # Minor units per currency: USD cents, KHR sen.
    daily-limits:
      USD: ${TRANSFER_DAILY_LIMIT_USD_MINOR:100000}
      KHR: ${TRANSFER_DAILY_LIMIT_KHR_MINOR:400000000}
  statements:
    cron: "${STATEMENT_CRON:0 5 0 * * *}"

server:
  port: ${SERVER_PORT:8080}
